name: Scheduled Daily Ingestion

on:
  schedule:
    # Run daily at 02:30 UTC (08:00 IST)
    - cron: '30 2 * * *'
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Ingest latest atmospheric observations & weather
        env:
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
        run: |
          python backend/ml/ingest.py
          python backend/ml/baseline.py

      - name: Commit and push updated database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): automated daily ingestion [skip ci]" && git push)
