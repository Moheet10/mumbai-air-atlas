name: Scheduled 6-Hour Forecast Logger

on:
  schedule:
    # Run every 6 hours at minute 0 (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  log-forecast:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run scheduled forecast logger (rounds issue_time to top of hour)
        env:
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
        run: |
          python backend/app/services/cron_forecast_logger.py

      - name: Commit and push forecast_log.csv to data branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin data || true
          git checkout data 2>/dev/null || git checkout -b data
          git checkout main -- backend/data/forecast_log.csv
          git add backend/data/forecast_log.csv
          git diff --staged --quiet || (git commit -m "chore(telemetry): automated 6h forecast log [skip ci]" && git push origin data)
